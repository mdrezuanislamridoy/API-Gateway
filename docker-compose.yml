services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_db']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db-init:
    build:
      context: .
      dockerfile: app/auth-service/Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public
    depends_on:
      auth-db:
        condition: service_healthy
    command: pnpm exec prisma db push --config app/auth-service/prisma.config.ts

  auth-service:
    build:
      context: .
      dockerfile: app/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: replace-this-with-a-long-random-secret
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public
    ports:
      - '3001:3001'
    depends_on:
      auth-db-init:
        condition: service_completed_successfully

  order-db:
    image: postgres:16-alpine
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - '5433:5432'
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d order_db']
      interval: 5s
      timeout: 5s
      retries: 10

  order-db-init:
    build:
      context: .
      dockerfile: app/order-service/Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db?schema=public
    depends_on:
      order-db:
        condition: service_healthy
    command: pnpm exec prisma db push --config app/order-service/prisma.config.ts

  order-service:
    build:
      context: .
      dockerfile: app/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db?schema=public
    ports:
      - '3003:3003'
    depends_on:
      order-db-init:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: app/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3003
      PRODUCT_SERVICE_URL: http://product-service:3002
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - order-service


volumes:
  auth-postgres-data:
  order-postgres-data:
